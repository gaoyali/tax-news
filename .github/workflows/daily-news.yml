# 税务稽查工作台 · 云端每日抓取公开新闻（小白单公开仓版）
#
# 只需一个 Public 公开仓库，不需要令牌、不需要 Secrets。
# 每天北京时间 08:00（UTC 00:00）自动抓取，结果导出为 news.json，
# 由 jsDelivr 分发给手机页面。本仓库不含任何内部资料，只有公开新闻。

name: 每日新闻抓取并导出 news.json

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:
    inputs:
      target_date:
        description: '补抓日期 YYYY-MM-DD（留空＝北京时间当天）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: wb-daily-news-public
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python（抓取器零第三方依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取权威发布与财经涉税热点，导出 news.json
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then
            if [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              DATE_ARG="--date $TARGET_DATE"
            else
              echo "::warning::补抓日期格式不合法（需 YYYY-MM-DD），已忽略：$TARGET_DATE"
            fi
          fi
          python3 抓取器/fetch_news.py --ci $DATE_ARG --export-json news.json

      - name: 提交 news.json 与去重留档
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "workbuddy-news-bot"
          git config user.email "workbuddy-news-bot@users.noreply.github.com"
          git add news.json 抓取器/state/seen.json 抓取器/state/archive.json \
                  抓取器/state/last.json 抓取器/state/ci_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本次数据无变化，跳过提交（幂等）"
          else
            git commit -m "chore(news): 每日公开新闻 $(date -u -d '+8 hours' +%F)"
            git push
          fi

      - name: 运行摘要（手机打开 Actions 运行页可核查）
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          p = '抓取器/state/ci_result.json'
          r = json.load(open(p, encoding='utf-8')) if os.path.exists(p) else {}
          def cnt(v):
            # ci_result 里既可能是条数(int)也可能是条目数组(list)，两种都兼容
            if v is None: return 0
            if isinstance(v, (int, float)): return int(v)
            if isinstance(v, (list, tuple, dict)): return len(v)
            try: return int(v)
            except (TypeError, ValueError): return 0
          lines = [
            "## 每日公开新闻抓取（%s）" % r.get('target_date', ''),
            "",
            "| 项目 | 结果 |", "| --- | --- |",
            "| 状态 | `%s` |" % r.get('status'),
            "| 抓取时间 | %s |" % r.get('fetched_at'),
            "| 官方权威源 | %s / %s 可用 |" % (r.get('sources_ok'), r.get('sources_total')),
            "| 本日新增 | %s 条 |" % cnt(r.get('today')),
            "| 近 7 日权威发布 | %s 条 |" % cnt(r.get('recent')),
            "| 二级财经线索 | %s 条（仅作线索） |" % cnt(r.get('hotspots')),
            "",
          ]
          if r.get('fallback_reason'):
            lines += ["> 空结果保护：" + r['fallback_reason'], ""]
          lines += [
            "### 手机端取数地址", "",
            "`https://cdn.jsdelivr.net/gh/gaoyali/tax-news@main/news.json`", "",
            "> 打开本仓库 Actions 每次运行页可看到本摘要，核对真实抓取时间。"
            "jsDelivr 可能缓存数小时，页面会如实显示数据抓取时间。", "",
          ]
          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if out:
            with open(out, 'a', encoding='utf-8') as f:
              f.write("\n".join(lines))
          print("\n".join(lines))
          PY
